name: tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund --no-package-lock
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: python -m pytest -q --ignore=tests/test_pipeline.py

  pipeline:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            pytest_args: --ignore=tests/test_ui.py
          - os: macos-latest
            python: '3.14'
            pytest_args: tests/test_pipeline.py
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install -e '.[dev]'
      - name: Verify Python source compatibility
        run: python -m compileall -q src
      - run: python -m pytest -q ${{ matrix.pytest_args }}
