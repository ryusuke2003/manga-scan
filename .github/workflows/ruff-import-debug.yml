name: ruff-import-debug

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.8
      - name: Show Ruff import fix
        run: |
          ruff check --fix src/manga_scan/export.py
          git diff -- src/manga_scan/export.py
