# Copy to config.toml. Relative model paths resolve against this file's directory.
video_sample_fps = 10.0
max_video_pixels = 40000000 # Reject video streams above this many pixels per frame
max_video_dimension = 8192 # Reject unusual width/height even if total pixels are below the cap
max_video_duration_seconds = 14400.0 # 4h maximum across all input video parts
analysis_width = 768
stable_frames = 5
motion_threshold = 0.012
turn_threshold = 0.025
candidates_per_spread = 7
processing_workers = 3 # 1..4; candidate analysis/finger alignment, split page render uses at most 2
output_layout = "spread" # "spread": one image/PDF page per spread (default); "split": left/right pages
candidate_selection_mode = "spread" # "spread" / "per_page"; per_page selects left/right independently

sharpness_weight = 1.0
motion_weight = 2.0
hand_overlap_weight = 8.0
glare_overlap_weight = 6.0 # Penalize likely specular reflection in candidate selection
distortion_weight = 0.3
flatness_weight = 0.2
clipping_weight = 0.2
exposure_weight = 0.3

hand_backend = "mediapipe" # "none" is explicit opt-out; all pages become suspect
hand_model = "models/hand_landmarker.task"
hand_padding = 0.015
finger_repair = true # Requires hand_backend="mediapipe"; set false when hand detection is disabled
glare_repair = true # Reuse the multi-frame repair engine for conservative glare masks
finger_repair_min_coverage = 0.9 # Final donor + fallback coverage required to clear the review warning
finger_repair_fallback = "paper" # "paper": fill only safe plain-paper regions; "preserve": keep fingers; "white": force white fill
page_background_fill = "paper" # Whole-spread output only: "paper" hides desk outside trusted page outlines; "preserve" keeps it; "white" forces white

duplicate_hash_distance = 4
duplicate_ssim = 0.985
duplicate_suspect_ssim = 0.94
dedupe_window = 3

refine_quad = true # Conservative spread-ROI refinement
quad_max_shift = 0.025
roi_tracking = true # Track conservative book movement between stable spreads
roi_tracking_max_step = 0.08 # Maximum normalized corner movement accepted per spread
roi_tracking_max_total = 0.16 # Maximum cumulative movement from the confirmed reference ROI
perspective_mode = "spread" # "spread" warps the whole spread; "per_page" warps left/right pages separately
page_contour_min_confidence = 0.55 # spread/split page detection falls back to the reference ROI below this confidence
split_mode = "auto" # Legacy/fallback split; "auto" searches a dark valley near the center
spine_ratio = 0.5
gutter_fraction = 0.0 # Keep all pixels by default
reading_order = "rtl"
image_format = "png" # Or "jpeg"
max_image_pixels = 60000000 # Validate dimensions before Pillow decodes the image
max_image_dimension = 12000
max_image_files = 5000 # Static-image folder input only
jpeg_quality = 92
grayscale = false
contrast = 1.0
illumination_correction = true # Low-frequency lighting/shadow normalization
illumination_strength = 0.7 # 0 = no effect, 1 = full correction
white_normalization = true # Gently brighten only paper-like highlights
white_target = 245 # 200..255; target for estimated paper white
white_strength = 0.6 # 0..1; darker artwork is protected by a luminance mask
rotation = 0 # Manual/resolved clockwise rotation: 0 / 90 / 180 / 270
auto_rotation = true # Detect once at project creation; confirm or override in the setup preview
dewarp_mode = "auto" # "off" / "manual" / "auto"
dewarp_strength = 0.0 # manual mode only; legacy symmetric cylindrical remap, 0..0.6
dewarp_max_strength = 0.25 # auto 2D profile upper bound per image row; keep conservative
dewarp_min_confidence = 0.6 # auto mode falls back without remap below this confidence
pdf_dpi = 300 # Physical page size only; no pixel resampling
# hwaccel = "videotoolbox" # Optional override; macOS already defaults to VideoToolbox, other platforms default to CPU
save_lowres = false # true writes all sampled small frames; otherwise streamed

suspect_sharpness = 60.0
suspect_hand_overlap = 0.015
suspect_glare_overlap = 0.01
interval_gap_factor = 3.0
auto_high_fps_fallback = true # Rescan only problematic spreads / missing-page windows at higher density
auto_high_fps_fallback_fps = 60.0 # Capped at the source video's actual fps
auto_high_fps_min_stable_seconds = 0.18 # Missing-page recovery requires this much continuous low motion
