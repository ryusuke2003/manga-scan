# Copy to config.toml. Relative model paths resolve against this file's directory.
video_sample_fps = 10.0
analysis_width = 768
stable_frames = 5
motion_threshold = 0.012
turn_threshold = 0.025
candidates_per_spread = 7

sharpness_weight = 1.0
motion_weight = 2.0
hand_overlap_weight = 8.0
distortion_weight = 0.3
flatness_weight = 0.2
clipping_weight = 0.2
exposure_weight = 0.3

hand_backend = "mediapipe" # "none" is explicit opt-out; all pages become suspect
hand_model = "models/hand_landmarker.task"
hand_padding = 0.015

duplicate_hash_distance = 4
duplicate_ssim = 0.985
duplicate_suspect_ssim = 0.94
dedupe_window = 3

refine_quad = false # Opt-in conservative spread-ROI refinement
quad_max_shift = 0.025
perspective_mode = "spread" # "per_page" auto-detects left/right page contours and warps each page separately
page_contour_min_confidence = 0.5 # per_page falls back to legacy spread split below this confidence
split_mode = "center" # Legacy/fallback split; "auto" searches a dark valley near the center
spine_ratio = 0.5
gutter_fraction = 0.0 # Keep all pixels by default
reading_order = "rtl"
image_format = "png" # Or "jpeg"
jpeg_quality = 92
grayscale = false
contrast = 1.0
illumination_correction = false # Opt-in low-frequency lighting/shadow normalization
illumination_strength = 0.7 # 0 = no effect, 1 = full correction
white_normalization = false # Opt-in: gently brighten only paper-like highlights
white_target = 245 # 200..255; target for estimated paper white
white_strength = 0.6 # 0..1; darker artwork is protected by a luminance mask
rotation = 0 # Clockwise, after split: 0 / 90 / 180 / 270
dewarp_strength = 0.0 # 0 = off; experimental symmetric cylindrical remap, 0..0.6
pdf_dpi = 300 # Physical page size only; no pixel resampling
hwaccel = "none" # Mac: "videotoolbox"; CPU fallback if hardware initialization fails
save_lowres = false # true writes all sampled small frames; otherwise streamed

suspect_sharpness = 60.0
suspect_hand_overlap = 0.015
interval_gap_factor = 3.0

